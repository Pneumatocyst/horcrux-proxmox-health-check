name: Publish v1.0.1 Release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-v1.0.1.yml
      - .github/release-notes-v1.0.1.md

permissions:
  contents: write

concurrency:
  group: publish-v1.0.1
  cancel-in-progress: false

env:
  RELEASE_TAG: v1.0.1
  RELEASE_TITLE: HORCRUX Proxmox Health Check v1.0.1
  RELEASE_COMMIT: e7ae17ceab2dd05ab7bcfd0e7dea5b75f3b3e353

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check whether the release already exists
        id: release_check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out release metadata
        if: steps.release_check.outputs.exists != 'true'
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check out v1.0.1 source
        if: steps.release_check.outputs.exists != 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_COMMIT }}
          path: release-source
          persist-credentials: false

      - name: Validate release source
        if: steps.release_check.outputs.exists != 'true'
        run: |
          bash -n \
            release-source/proxmox-health-check.sh \
            release-source/tests/smoke-test.sh
          bash release-source/tests/smoke-test.sh
          test "$(release-source/proxmox-health-check.sh --version)" = \
            "HORCRUX Proxmox Health Check 1.0.1"

      - name: Build release assets
        if: steps.release_check.outputs.exists != 'true'
        run: |
          set -euo pipefail

          release_root="$RUNNER_TEMP/horcrux-release"
          package_dir="$release_root/horcrux-proxmox-health-check"
          mkdir -p "$package_dir"

          cp -a \
            release-source/.gitignore \
            release-source/CHANGELOG.md \
            release-source/LICENSE \
            release-source/README.md \
            release-source/proxmox-health-check.sh \
            release-source/services.example \
            "$package_dir/"
          cp -a release-source/docs release-source/tests "$package_dir/"

          chmod +x "$package_dir/proxmox-health-check.sh"
          cp "$package_dir/proxmox-health-check.sh" \
            "$release_root/proxmox-health-check-v1.0.1.sh"

          (
            cd "$release_root"
            zip -qr \
              "$GITHUB_WORKSPACE/HORCRUX_Proxmox_Health_Check_v1.0.1.zip" \
              horcrux-proxmox-health-check
          )

          cp "$release_root/proxmox-health-check-v1.0.1.sh" "$GITHUB_WORKSPACE/"
          sha256sum \
            HORCRUX_Proxmox_Health_Check_v1.0.1.zip \
            proxmox-health-check-v1.0.1.sh \
            > SHA256SUMS.txt

      - name: Publish GitHub Release
        if: steps.release_check.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" \
            --target "$RELEASE_COMMIT" \
            --title "$RELEASE_TITLE" \
            --notes-file .github/release-notes-v1.0.1.md \
            --latest \
            HORCRUX_Proxmox_Health_Check_v1.0.1.zip \
            proxmox-health-check-v1.0.1.sh \
            SHA256SUMS.txt

      - name: Verify published release
        if: steps.release_check.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$RELEASE_TAG" \
            --json tagName,name,isDraft,isPrerelease,url,assets
