name: Feature request
description: Propose a new check, output format, or documentation improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the operator problem first. Proposed features must preserve the project's read-only safety model.
  - type: textarea
    id: problem
    attributes:
      label: Operator problem
      description: What health question is currently difficult to answer?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the desired check, output, option, or documentation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: How do you handle this today?
  - type: textarea
    id: validation
    attributes:
      label: Validation ideas
      description: Suggest safe mock cases or sanitized output that could test the feature.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: This proposal does not require automatic repairs, deletions, restarts, upgrades, or configuration changes.
          required: true
        - label: I reviewed the roadmap and existing issues for overlap.
          required: true

